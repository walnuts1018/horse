name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: horse_test
          POSTGRES_PASSWORD: horse_test_ci_only
          POSTGRES_DB: horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horse_test -d horse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      RUST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      HORSE_TEST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install Rust components
        run: rustup component add --toolchain 1.99.1 rustfmt clippy

      - name: Lint GitHub Actions
        run: mise run lint:actions

      - parallel:
          - name: Check Rust workspace
            run: mise run rust:check

          - name: Check Rust architecture
            run: mise run rust:architecture:check

          - name: Check Rust formatting
            run: mise run rust:fmt:check

          - name: Lint Rust
            run: mise run lint

          - name: Apply fresh database migrations
            run: mise run db:migrate

          - name: Lint OCR service
            run: mise run ocr:lint

          - name: Install frontend dependencies
            working-directory: web
            run: pnpm install --frozen-lockfile

      - parallel:
          - name: Test Rust workspace
            run: mise run rust:test

          - name: Test OCR service
            run: mise run ocr:test

          - name: Validate Relay artifacts
            run: mise run web:relay:validate

          - name: Check frontend types
            run: mise run web:check

          - name: Lint frontend
            run: mise run web:lint

          - name: Check frontend architecture
            run: mise run web:lint:fsd

          - name: Test frontend model logic
            run: mise run web:test

          - name: Check frontend formatting
            run: mise run web:format:check

          - name: Check GraphQL formatting
            run: mise run web:format:graphql:check

          - name: Build frontend
            run: mise run web:build

  browser-e2e:
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: horse_test
          POSTGRES_PASSWORD: horse_test_ci_only
          POSTGRES_DB: horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horse_test -d horse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      RUST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      HORSE_TEST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install Rust components
        run: rustup component add --toolchain 1.99.1 rustfmt clippy

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run browser end-to-end tests
        run: |
          mise exec -- cargo build -p horse-api -p horse-e2e-fixture
          mise run web:e2e:install
          mise run web:e2e

  publish:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    cache-mode: write
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Cargo cache mounts
        id: cargo-cache
        # jactionlint ignore=cache-poisoning
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: horse-cargo-mounts-${{ runner.os }}-linux-amd64-arm64-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          restore-keys: |
            horse-cargo-mounts-${{ runner.os }}-linux-amd64-arm64-

      - name: Inject Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
          cache-map: |
            {
              "cache-mount/horse-cargo-registry": {
                "id": "horse-cargo-registry",
                "target": "/usr/local/cargo/registry",
                "sharing": "locked"
              },
              "cache-mount/horse-cargo-git": {
                "id": "horse-cargo-git",
                "target": "/usr/local/cargo/git",
                "sharing": "locked"
              }
            }

      - parallel:
          - name: Build and publish Node web image
            id: web-image
            # jactionlint ignore=cache-poisoning
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              file: Dockerfile
              target: web-runtime
              platforms: linux/amd64,linux/arm64
              push: true
              provenance: mode=max
              sbom: true
              cache-from: type=gha,scope=horse-web
              cache-to: type=gha,mode=max,scope=horse-web
              tags: |
                ghcr.io/${{ github.repository }}-web:latest
                ghcr.io/${{ github.repository }}-web:v0.0.${{ github.run_number }}

          - name: Build and publish OCR image
            id: ocr-image
            # jactionlint ignore=cache-poisoning
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              file: services/ocr/Dockerfile
              platforms: linux/amd64
              push: true
              provenance: mode=max
              sbom: true
              cache-from: type=gha,scope=horse-ocr
              cache-to: type=gha,mode=max,scope=horse-ocr
              tags: |
                ghcr.io/${{ github.repository }}-ocr:latest
                ghcr.io/${{ github.repository }}-ocr:v0.0.${{ github.run_number }}

      - name: Report published images
        env:
          WEB_IMAGE_DIGEST: ${{ steps.web-image.outputs.digest }}
          OCR_IMAGE_DIGEST: ${{ steps.ocr-image.outputs.digest }}
          IMAGE_TAG: v0.0.${{ github.run_number }}
        run: |
          {
            printf 'Published ghcr.io/%s-web:%s@%s (Node web).\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$WEB_IMAGE_DIGEST"
            printf 'Published ghcr.io/%s-ocr:%s@%s.\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$OCR_IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-rust-amd64:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    cache-mode: write
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Cargo cache mounts
        id: cargo-cache
        # jactionlint ignore=cache-poisoning
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: horse-cargo-mounts-${{ runner.os }}-linux-amd64-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          restore-keys: |
            horse-cargo-mounts-${{ runner.os }}-linux-amd64-

      - name: Inject Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
          cache-map: |
            {
              "cache-mount/horse-cargo-registry": {
                "id": "horse-cargo-registry",
                "target": "/usr/local/cargo/registry",
                "sharing": "locked"
              },
              "cache-mount/horse-cargo-git": {
                "id": "horse-cargo-git",
                "target": "/usr/local/cargo/git",
                "sharing": "locked"
              }
            }

      - name: Build and publish Rust API and worker image
        id: image
        # jactionlint ignore=cache-poisoning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: rust-runtime
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=horse-rust-amd64
          cache-to: type=gha,mode=max,scope=horse-rust-amd64

  publish-rust-arm64:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 45
    cache-mode: write
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Restore Cargo cache mounts
        id: cargo-cache
        # jactionlint ignore=cache-poisoning
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache-mount
          key: horse-cargo-mounts-${{ runner.os }}-linux-arm64-${{ hashFiles('Cargo.lock', 'Dockerfile') }}
          restore-keys: |
            horse-cargo-mounts-${{ runner.os }}-linux-arm64-

      - name: Inject Cargo cache mounts
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          skip-extraction: ${{ steps.cargo-cache.outputs.cache-hit }}
          cache-map: |
            {
              "cache-mount/horse-cargo-registry": {
                "id": "horse-cargo-registry",
                "target": "/usr/local/cargo/registry",
                "sharing": "locked"
              },
              "cache-mount/horse-cargo-git": {
                "id": "horse-cargo-git",
                "target": "/usr/local/cargo/git",
                "sharing": "locked"
              }
            }

      - name: Build and publish Rust API and worker image
        id: image
        # jactionlint ignore=cache-poisoning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          target: rust-runtime
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=horse-rust-arm64
          cache-to: type=gha,mode=max,scope=horse-rust-arm64

  publish-rust-index:
    if: github.event_name == 'push'
    needs:
      - publish-rust-amd64
      - publish-rust-arm64
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create and report multi-platform image index
        env:
          AMD64_DIGEST: ${{ needs.publish-rust-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ needs.publish-rust-arm64.outputs.digest }}
          IMAGE_TAG: v0.0.${{ github.run_number }}
        run: |
          image="ghcr.io/$GITHUB_REPOSITORY"
          metadata_file="$RUNNER_TEMP/image-index.json"
          docker buildx imagetools create \
            --tag "$image:latest" \
            --tag "$image:$IMAGE_TAG" \
            --metadata-file "$metadata_file" \
            "$image@$AMD64_DIGEST" \
            "$image@$ARM64_DIGEST"
          digest="$(jq -r '."containerimage.descriptor".digest' "$metadata_file")"
          printf 'Published %s:%s@%s (Rust API, worker, and Atlas).\n' "$image" "$IMAGE_TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"
