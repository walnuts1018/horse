name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: horse_test
          POSTGRES_PASSWORD: horse_test_ci_only
          POSTGRES_DB: horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horse_test -d horse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      RUST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      HORSE_TEST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2

      - name: Install Rust components
        run: rustup component add --toolchain 1.99.1 rustfmt clippy

      - name: Lint GitHub Actions
        run: mise run lint:actions

      - parallel:
          - name: Check Rust workspace
            run: mise run rust:check

          - name: Check Rust formatting
            run: mise run rust:fmt:check

          - name: Lint Rust
            run: mise run lint

          - name: Apply fresh database migrations
            run: mise run db:migrate

          - name: Lint OCR service
            run: mise run ocr:lint

          - name: Install frontend dependencies
            working-directory: web
            run: pnpm install --frozen-lockfile

      - parallel:
          - name: Test Rust workspace
            run: mise run rust:test

          - name: Test OCR service
            run: mise run ocr:test

          - name: Validate Relay artifacts
            run: mise run web:relay:validate

          - name: Check frontend types
            run: mise run web:check

          - name: Lint frontend
            run: mise run web:lint

          - name: Check frontend architecture
            run: mise run web:lint:fsd

          - name: Test frontend model logic
            run: mise run web:test

          - name: Check frontend formatting
            run: mise run web:format:check

          - name: Check GraphQL formatting
            run: mise run web:format:graphql:check

          - name: Build frontend
            run: mise run web:build

  publish:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    cache-mode: none
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - parallel:
          - name: Build and publish Rust API and worker image
            id: image
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              file: Dockerfile
              target: rust-runtime
              platforms: linux/amd64,linux/arm64
              push: true
              provenance: mode=max
              sbom: true
              tags: |
                ghcr.io/${{ github.repository }}:latest
                ghcr.io/${{ github.repository }}:v0.0.${{ github.run_number }}

          - name: Build and publish Node web image
            id: web-image
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              file: Dockerfile
              target: web-runtime
              platforms: linux/amd64,linux/arm64
              push: true
              provenance: mode=max
              sbom: true
              tags: |
                ghcr.io/${{ github.repository }}-web:latest
                ghcr.io/${{ github.repository }}-web:v0.0.${{ github.run_number }}

          - name: Build and publish OCR image
            id: ocr-image
            uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
            with:
              context: .
              file: services/ocr/Dockerfile
              platforms: linux/amd64
              push: true
              provenance: mode=max
              sbom: true
              tags: |
                ghcr.io/${{ github.repository }}-ocr:latest
                ghcr.io/${{ github.repository }}-ocr:v0.0.${{ github.run_number }}

      - name: Report published images
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          WEB_IMAGE_DIGEST: ${{ steps.web-image.outputs.digest }}
          OCR_IMAGE_DIGEST: ${{ steps.ocr-image.outputs.digest }}
          IMAGE_TAG: v0.0.${{ github.run_number }}
        run: |
          {
            printf 'Published ghcr.io/%s:%s@%s (Rust API, worker, and Atlas).\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$IMAGE_DIGEST"
            printf 'Published ghcr.io/%s-web:%s@%s (Node web).\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$WEB_IMAGE_DIGEST"
            printf 'Published ghcr.io/%s-ocr:%s@%s.\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$OCR_IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
