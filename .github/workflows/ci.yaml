name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: horse_test
          POSTGRES_PASSWORD: horse_test_ci_only
          POSTGRES_DB: horse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U horse_test -d horse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
      HORSE_TEST_DATABASE_URL: postgres://horse_test:horse_test_ci_only@localhost:5432/horse_test?sslmode=disable
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Check Go formatting
        run: test -z "$(gofmt -l $(rg --files -g '*.go'))"

      - name: Lint Go
        run: mise run lint

      - name: Build Go
        run: go build ./...

      - name: Apply fresh database migrations
        run: mise run db:migrate

      - name: Test Go
        run: mise run test

      - name: Lint OCR service
        run: mise run ocr:lint

      - name: Install frontend dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Validate Relay artifacts
        run: mise run web:relay:validate

      - name: Check frontend types
        run: mise run web:check

      - name: Lint frontend
        run: mise run web:lint

      - name: Check frontend architecture
        run: mise run web:lint:fsd

      - name: Check frontend formatting
        run: mise run web:format:check

      - name: Build frontend
        run: mise run web:build

  publish:
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v0.0.0-${{ github.sha }}-${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and publish OCR image
        id: ocr-image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/ocr/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-ocr:latest
            ghcr.io/${{ github.repository }}-ocr:v0.0.0-${{ github.sha }}-${{ github.run_number }}
          cache-from: type=gha,scope=horse-ocr
          cache-to: type=gha,scope=horse-ocr,mode=max

      - name: Report published images
        env:
          APP_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          OCR_IMAGE_DIGEST: ${{ steps.ocr-image.outputs.digest }}
          IMAGE_TAG: v0.0.0-${{ github.sha }}-${{ github.run_number }}
        run: |
          {
            printf 'Published `ghcr.io/%s:%s@%s`.\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$APP_IMAGE_DIGEST"
            printf 'Published `ghcr.io/%s-ocr:%s@%s`.\n' "$GITHUB_REPOSITORY" "$IMAGE_TAG" "$OCR_IMAGE_DIGEST"
          } >> "$GITHUB_STEP_SUMMARY"
