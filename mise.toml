[tools]
go = "1.27.2"
node = "24.21.0"
pnpm = "11.28.2"
golangci-lint = "2.14.0"
atlas = "1.3.0"
uv = "0.12.20"
python = "3.12.14"

[tasks.test]
description = "Goのテスト"
run = "go test ./... -v"

[tasks.lint]
description = "Goの静的解析"
run = "golangci-lint run ./..."

[tasks."evaluation:run"]
description = "保存済みのAI評価データセットをオフライン評価"
run = "go run ./cmd/evaluate --dataset ${EVALUATION_DATASET:-internal/evaluation/datasets/synthetic-v1.json}"

[tasks."web:dev"]
description = "フロントエンドの開発サーバー"
dir = "web"
run = "pnpm dev"

[tasks."web:build"]
description = "フロントエンドのビルド"
dir = "web"
run = "pnpm build"

[tasks."web:check"]
description = "フロントエンドの型検査"
dir = "web"
run = "pnpm exec tsc --noEmit"

[tasks."web:relay"]
description = "Relayの型と操作の生成"
dir = "web"
run = "pnpm relay"

[tasks."web:relay:validate"]
description = "Relay生成物の整合性"
dir = "web"
run = "pnpm relay:validate"

[tasks."web:lint:fsd"]
description = "Feature-Sliced Designの依存関係検査"
dir = "web"
run = "pnpm lint:steiger"

[tasks."web:lint"]
description = "フロントエンドの静的解析"
dir = "web"
run = ["pnpm lint:oxlint", "pnpm lint:style"]

[tasks."web:format:check"]
description = "フロントエンドのフォーマット検査"
dir = "web"
run = "pnpm format:check"

[tasks.api]
description = "APIの起動"
run = "go run ./cmd/api"

[tasks.worker]
description = "取り込みワーカーの起動"
run = "go run ./cmd/worker"

[tasks."hash:migrations"]
description = "Atlasマイグレーションのチェックサム"
run = "atlas migrate hash --dir file://migrations"

[tasks."db:migrate"]
description = "PostgreSQLマイグレーション"
run = "atlas migrate apply --env kubernetes"

[tasks."db:generate"]
description = "Bobのモデル生成"
run = "go tool bobgen-sql -c bobgen.yaml"

[tasks."generate:graphql"]
description = "GraphQLサーバーの生成"
run = "go tool gqlgen generate"

[tasks."ocr:lock"]
description = "OCRサービスの依存関係固定"
dir = "services/ocr"
run = "uv lock"

[tasks."ocr:lint"]
description = "OCRサービスの静的解析"
dir = "services/ocr"
run = "uv run --only-group dev ruff check ."
