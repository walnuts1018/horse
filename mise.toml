[tools]
rust = "1.99.1"
"cargo:diesel_cli" = { version = "2.3.14", default-features = false, features = ["postgres", "pq-sys/bundled"] }
node = "24.22.2"
pnpm = "12.11.2"
atlas = "1.3.4"
uv = "0.13.1"
python = "3.13.16"
jactionlint = "2.2.0"

[tasks.test]
description = "Rust workspaceのテスト"
run = "cargo test --workspace"

[tasks.build]
description = "Rust workspaceのビルド"
run = "cargo build --workspace"

[tasks.lint]
description = "Rust workspaceの静的解析"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks."rust:fmt:check"]
description = "Rustコードの整形検査"
run = "cargo fmt --all -- --check"

[tasks."rust:check"]
description = "Rust workspaceの型検査"
run = "cargo check --workspace"

[tasks."rust:architecture:check"]
description = "Rust domain/applicationの依存境界検査"
run = "python3 scripts/check_rust_architecture.py"

[tasks."rust:test"]
description = "Rust workspaceのテスト"
run = "cargo test --workspace"

[tasks."rust:db:schema"]
description = "Atlas schemaからDiesel schemaを生成"
run = "diesel print-schema --database-url \"$RUST_DATABASE_URL\" --schema public > platform/postgres-common/src/schema.rs"

[tasks."rust:db:schema:check"]
description = "生成済みDiesel schemaとDBスキーマの差分確認"
run = "diesel print-schema --database-url \"$RUST_DATABASE_URL\" --schema public | diff -u platform/postgres-common/src/schema.rs -"

[tasks."rust:db:migrate"]
description = "Rust用Atlasマイグレーション"
run = "atlas migrate apply --config file://atlas-rust.hcl --env rust"

[tasks."lint:actions"]
description = "GitHub Actionsの静的解析"
run = "jactionlint"

[tasks."web:dev"]
description = "フロントエンドの開発サーバー"
dir = "web"
run = "pnpm dev"

[tasks."web:build"]
description = "フロントエンドのビルド"
dir = "web"
run = "pnpm build"

[tasks."web:check"]
description = "フロントエンドの型検査"
dir = "web"
run = "pnpm exec tsc --noEmit"

[tasks."web:test"]
description = "フロントエンドのテスト"
dir = "web"
run = "pnpm test"

[tasks."web:e2e:install"]
description = "PlaywrightのChromiumをインストール"
dir = "web"
run = "pnpm e2e:install"

[tasks."web:e2e"]
description = "ブラウザーE2Eテスト"
dir = "web"
run = "pnpm e2e"

[tasks."web:relay"]
description = "Relayの型と操作の生成"
dir = "web"
run = "pnpm relay"

[tasks."web:relay:validate"]
description = "Relay生成物の整合性"
dir = "web"
run = "pnpm relay:validate"

[tasks."web:lint:fsd"]
description = "Feature-Sliced Designの依存関係検査"
dir = "web"
run = "pnpm lint:steiger"

[tasks."web:lint"]
description = "フロントエンドの静的解析"
dir = "web"
run = ["pnpm lint:oxlint", "pnpm lint:markup", "pnpm lint:style"]

[tasks."web:format"]
description = "フロントエンドのコードをフォーマット"
dir = "web"
run = "pnpm format"

[tasks."web:format:check"]
description = "フロントエンドのフォーマット検査"
dir = "web"
run = "pnpm format:check"

[tasks."web:format:graphql"]
description = "GraphQL SDLのフォーマット"
run = "mise exec -- web/node_modules/.bin/oxfmt --write 'graphql/**/*.graphql'"

[tasks."web:format:graphql:check"]
description = "GraphQL SDLのフォーマット検査"
run = "mise exec -- web/node_modules/.bin/oxfmt --check 'graphql/**/*.graphql'"

[tasks.api]
description = "APIの起動"
run = "cargo run -p horse-api"

[tasks.worker]
description = "取り込みワーカーの起動"
run = "cargo run -p horse-worker"

[tasks."hash:migrations"]
run = "atlas migrate hash --dir file://rust-migrations"

[tasks."db:migrate"]
description = "Rust用PostgreSQLマイグレーション"
run = "atlas migrate apply --config file://atlas-rust.hcl --env rust"

[tasks."ocr:lock"]
description = "OCRサービスの依存関係固定"
dir = "services/ocr"
run = "uv lock"

[tasks."ocr:lint"]
description = "OCRサービスの静的解析"
dir = "services/ocr"
run = "uv run --only-group dev ruff check ."

[tasks."ocr:test"]
description = "OCRサービスのテスト"
dir = "services/ocr"
run = "uv run --only-group test python -m unittest -v"
