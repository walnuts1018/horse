schema:
  - graphql/*.graphql
exec:
  filename: internal/graph/generated.go
  package: graph
model:
  filename: internal/graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: "{name}.resolvers.go"
models:
  Pool:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.PoolVariant
  PersonalPool:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.PersonalPool
  UnconfiguredPersonalPool:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.UnconfiguredPersonalPool
  SharedPool:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.SharedPool
  UnconfiguredSharedPool:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.UnconfiguredSharedPool
  Settlement:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.SettlementVariant
  HouseholdInvitation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.HouseholdInvitationVariant
  Observation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.ObservationVariant
  UnmatchedObservation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.UnmatchedObservation
  ConfirmedObservation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.ConfirmedObservation
  PendingHouseholdInvitation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.PendingHouseholdInvitation
  AcceptedHouseholdInvitation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AcceptedHouseholdInvitation
  RevokedHouseholdInvitation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.RevokedHouseholdInvitation
  ExpiredHouseholdInvitation:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.ExpiredHouseholdInvitation
  OpenSettlement:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.OpenSettlement
  ClosedSettlement:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.ClosedSettlement
  Date:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.Date
  DateTime:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.DateTime
  Long:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.Long
  YearMonth:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.YearMonth
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.String
  Node:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.Node
  CreatePurchaseAllocationInput:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AllocationInput
  CorrectPurchaseAllocationInput:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AllocationInput
  UpdatePurchaseItemAllocationInput:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AllocationInput
  BulkUpdatePurchaseItemsAllocationInput:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AllocationInput
  SetDefaultAllocationItemInput:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AllocationInput
  SetAllocationRuleItemInput:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.AllocationInput
  CreatePurchasePaymentInput:
