schema:
  - graphql/*.graphql
exec:
  filename: internal/graph/generated.go
  package: graph
model:
  filename: internal/graph/model/models_gen.go
  package: model
resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph
  filename_template: "{name}.resolvers.go"
models:
  Date:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.Date
  DateTime:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.DateTime
  Long:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.Long
  YearMonth:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.YearMonth
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.String
  Node:
    model:
      - github.com/walnuts1018/horse/internal/graph/model.Node
