no_tests: true
type_system: database/sql
aliases:
  source_document_attachments:
    relationships:
      source_document_attachments_parent_household_fkey: ParentDocument
      source_document_attachments_child_household_fkey: ChildDocument
      source_document_attachments.source_document_attachments_parent_household_fkey: ParentAttachments
      source_document_attachments.source_document_attachments_child_household_fkey: ChildAttachments
  source_documents:
    relationships:
      source_document_attachments.source_document_attachments_parent_household_fkey: AttachmentsAsParent
      source_document_attachments.source_document_attachments_child_household_fkey: AttachmentsAsChild
plugins:
  dbinfo:
    destination: internal/postgres/generated/dbinfo
  enums:
    destination: internal/postgres/generated/enums
  models:
    destination: internal/postgres/generated/models
  dberrors:
    destination: internal/postgres/generated/dberrors
  factory:
    disabled: true
  queries:
    disabled: true
sql:
  dialect: psql
  driver: github.com/jackc/pgx/v5/stdlib
  pattern: migrations/*.sql
  uuid_pkg: gofrs
