[project]
name = "horse-ocr"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pillow>=11,<13",
  "pypdfium2>=5,<6",
  "paddlepaddle>=3.3.1,<3.4",
  "paddleocr>=3.7,<4",
]

[dependency-groups]
dev = ["ruff>=0.8,<1"]
test = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pillow>=11,<13",
  "pypdfium2>=5,<6",
  "python-multipart>=0.0.9,<1",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
