[project]
name = "horse-ocr"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "pillow>=11,<13",
  "paddlepaddle>=3.3.1,<3.4",
  "paddleocr>=3.7,<4",
]

[dependency-groups]
dev = ["ruff>=0.8,<1"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
