[package]
name = "cross-context-postgres"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
cross-context-application = { path = "../application" }
bookkeeping-application = { path = "../../bookkeeping/application" }
bookkeeping-domain = { path = "../../bookkeeping/domain" }
bookkeeping-postgres = { path = "../../bookkeeping/postgres" }
catalog-application = { path = "../../catalog/application" }
catalog-postgres = { path = "../../catalog/postgres" }
chrono = { workspace = true }
diesel = { workspace = true, features = ["32-column-tables"] }
diesel-async = { workspace = true }
evidence-application = { path = "../../evidence/application" }
horse-postgres-common = { path = "../../../platform/postgres-common" }
horse-household-change = { path = "../../../platform/household-change" }
horse-authorization = { path = "../../../platform/authorization" }
policy-application = { path = "../../policy/application" }
policy-postgres = { path = "../../policy/postgres" }
household-postgres = { path = "../../household/postgres" }
serde_json = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
horse-test-infra = { path = "../../../platform/test-infra" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
