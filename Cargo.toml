[workspace]
members = ["apps/api", "apps/worker", "crates/auth", "crates/bookkeeping-domain", "crates/bookkeeping-workflows", "crates/catalog-workflows", "crates/gemini-developer-api", "crates/graphql-api", "crates/worker-runtime", "crates/policy-workflows", "crates/household-workflows", "crates/http-api", "crates/postgres"]
resolver = "3"

[workspace.dependencies]
aws-config = "1.12.0"
aws-credential-types = "1.2"
aws-sdk-s3 = "1.152.0"
aes-gcm = "0.11"
base64 = "0.22"
csv = "1.4.0"
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "bb8"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v4", "v7"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
hmac = "0.13"
hex = "0.4"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-tls"] }
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
