[workspace]
members = ["apps/api", "crates/auth", "crates/bookkeeping-domain", "crates/bookkeeping-workflows", "crates/catalog-workflows", "crates/gemini-developer-api", "crates/policy-workflows", "crates/household-workflows", "crates/http-api", "crates/postgres"]
resolver = "3"

[workspace.dependencies]
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "bb8"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v4", "v7"] }
serde_json = "1"
