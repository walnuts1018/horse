[workspace]
members = [
    "apps/api",
    "apps/worker",
    "contexts/bookkeeping/domain",
    "contexts/bookkeeping/application",
    "contexts/bookkeeping/postgres",
    "contexts/catalog/application",
    "contexts/catalog/postgres",
    "contexts/household/application",
    "contexts/household/postgres",
    "contexts/policy/application",
    "contexts/policy/postgres",
    "contexts/evidence/application",
    "contexts/evidence/postgres",
    "contexts/cross-context/postgres",
    "platform/postgres-common",
    "platform/test-infra",
    "platform/observability",
    "adapters/ai",
    "adapters/graphql",
    "adapters/http",
    "adapters/identity",
    "adapters/object-storage",
    "adapters/extraction-queue",
    "adapters/worker-runtime",
]
resolver = "3"

[workspace.dependencies]
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
aws-config = "1.12.0"
aws-credential-types = "1.3"
aws-sdk-s3 = "1.152.0"
aes-gcm = "0.11"
base64 = "0.23"
csv = "1.4.0"
diesel = { version = "2.3", default-features = false, features = ["postgres_backend", "chrono", "uuid", "serde_json"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "bb8"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "v4", "v7"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
hmac = "0.13"
lapin = "2.5"
humantime = "2.3"
hex = "0.4"
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
sha2 = "0.11"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util"] }
tokio-rustls = "0.26"
webpki-roots = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
testcontainers-modules = { version = "0.15", default-features = false, features = ["postgres"] }
opentelemetry = { version = "0.33.1", features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.1", features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "metrics", "grpc-tonic", "http-proto", "http-json", "reqwest-client", "reqwest-rustls", "tls-webpki-roots"] }
opentelemetry-stdout = { version = "0.33.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry-http = "0.33.0"
opentelemetry-propagator-b3 = "0.33.0"
tracing-opentelemetry = "0.34.0"
