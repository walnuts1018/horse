[workspace]
members = ["crates/bookkeeping-domain", "crates/bookkeeping-workflows", "crates/postgres"]
resolver = "3"

[workspace.dependencies]
diesel = { version = "2.3", default-features = false, features = ["postgres_backend"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "bb8"] }
