type PurchaseChange {
  cursor: String!
  kind: PurchaseChangeKind!
  entityKind: PurchaseChangeEntity!
  entityId: ID! @goField(forceResolver: true)
  revision: Int!
  changedFields: [PurchaseChangeField!]!
  occurredAt: DateTime!
}

enum PurchaseChangeKind {
  CREATED
  POSTED
  UPDATED
  ITEM_UPDATED
  CORRECTED
}

enum PurchaseChangeEntity {
  PURCHASE
  PURCHASE_ITEM
}

enum PurchaseChangeField {
  OCCURRED_AT
  MERCHANT
  PAYMENT_ALLOCATIONS
  STATUS
  CORRECTION
  NAME
  AMOUNT_YEN
  QUANTITY
  PRINTED_UNIT_PRICE
  CATEGORY_ID
  PRODUCT_VARIANT_ID
  ALLOCATIONS
  TAGS
}

extend type Subscription {
  purchaseChanges(householdId: ID! @nodeID(of: "Household"), after: String): PurchaseChange!
}
