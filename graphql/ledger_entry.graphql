interface LedgerEntry implements Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: String!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: String!
}

type LedgerEdge {
  cursor: String!
  node: LedgerEntry!
}

type LedgerConnection {
  edges: [LedgerEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type PurchaseLedgerEntry implements LedgerEntry & Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: String!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: String!
  purchase: Purchase!
}

type FundingLedgerEntry implements LedgerEntry & Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: String!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: String!
  member: Member!
  pool: Pool!
}

type TransferLedgerEntry implements LedgerEntry & Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: String!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: String!
  fromMember: Member!
  toMember: Member!
  transferKind: TransferKind!
  loan: LoanBalance
}

enum TransferKind {
  ADVANCE
  LOAN
  REPAYMENT
  GIFT
}

type CorrectionLedgerEntry implements LedgerEntry & Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: String!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: String!
  purchase: Purchase!
}

extend type Query {
  ledger(householdId: ID! @nodeID(of: "Household"), after: String, before: String, first: Int, last: Int): LedgerConnection!
}
