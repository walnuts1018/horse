interface LedgerEntry implements Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: DateTime!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: DateTime!
}

type LedgerEdge {
  cursor: String!
  node: LedgerEntry!
}

type LedgerConnection {
  edges: [LedgerEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  ledger(householdId: ID! @nodeID(of: "Household"), after: String, before: String, first: Int, last: Int): LedgerConnection!
}
