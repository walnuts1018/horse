extend type Mutation {
  correctPurchase(input: CorrectPurchaseInput!): CorrectPurchaseResult!
  correctPurchaseFromStatement(input: CorrectPurchaseFromStatementInput!): CorrectPurchaseResult!
}

input CorrectPurchaseFromStatementInput {
  householdId: ID! @nodeID(of: "Household")
  sourceDocumentId: ID!
  sourceReference: String!
  target: CorrectPurchaseTargetInput!
  reason: String!
  idempotencyKey: String!
}

union CorrectPurchaseResult = CorrectPurchaseSuccess | CorrectPurchaseUserError

type CorrectPurchaseSuccess {
  result: Purchase!
}

input CorrectPurchaseInput {
  householdId: ID! @nodeID(of: "Household")
  target: CorrectPurchaseTargetInput!
  amountDeltaYen: Long!
  reason: String!
  allocations: [CorrectPurchaseAllocationInput!]
  paymentAllocations: [CorrectPurchasePaymentInput!]
  idempotencyKey: String!
}

input CorrectPurchaseTargetInput @oneOf {
  purchase: PurchaseCorrectionPurchaseTargetInput
  item: PurchaseCorrectionItemTargetInput
}

input PurchaseCorrectionPurchaseTargetInput {
  purchaseId: ID! @nodeID(of: "Purchase")
}

input PurchaseCorrectionItemTargetInput {
  purchaseId: ID! @nodeID(of: "Purchase")
  itemId: ID! @nodeID(of: "PurchaseItem")
}

input CorrectPurchaseAllocationInput {
  poolId: ID! @nodeID(of: "Pool")
  weight: Long!
}

input CorrectPurchasePaymentInput {
  paymentAccountId: ID! @nodeID(of: "Account")
  amountYen: Long!
}

type CorrectPurchaseUserError implements MutationError {
  code: MutationErrorCode!
  message: String!
}
