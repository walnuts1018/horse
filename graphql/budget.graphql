type Budget implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  categoryId: ID @goField(forceResolver: true)
  name: String!
  amountYen: Long!
  actualYen: Long!
  remainingYen: Long!
  startsOn: Date!
  endsOn: Date
  archived: Boolean!
  revision: Int!
}

type BudgetEdge {
  cursor: String!
  node: Budget!
}

type BudgetConnection {
  edges: [BudgetEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  budgets(householdId: ID! @nodeID(of: "Household"), period: YearMonth!, after: String, before: String, first: Int, last: Int): BudgetConnection!
}
