type MonthlyMemberSpending {
  period: YearMonth!
  memberId: ID! @goField(forceResolver: true)
  memberName: String!
  amountYen: Long!
}

type MonthlyMemberSpendingReport {
  items: [MonthlyMemberSpending!]!
  hasUnattributedPurchases: Boolean!
}

extend type Query {
  monthlyMemberSpending(householdId: ID! @nodeID(of: "Household"), from: YearMonth!, to: YearMonth!): MonthlyMemberSpendingReport!
}
