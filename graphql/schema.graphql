scalar Date
scalar DateTime
scalar Long
scalar YearMonth

directive @goField(
  forceResolver: Boolean
  name: String
  omittable: Boolean
) on FIELD_DEFINITION | INPUT_FIELD_DEFINITION
directive @nodeID(of: String!) on ARGUMENT_DEFINITION | INPUT_FIELD_DEFINITION
directive @oneOf on INPUT_OBJECT

interface Node {
  id: ID!
}

type Query {
  node(id: ID!): Node
  nodes(ids: [ID!]!): [Node]!
}

type Mutation

type Subscription

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

enum MutationErrorCode {
  BAD_INPUT
  CONFLICT
  NOT_FOUND
  MAIL_FORWARDING_DISABLED
}

interface MutationError {
  code: MutationErrorCode!
  message: String!
}
