interface HouseholdInvitation implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  expiresAt: DateTime!
  createdAt: DateTime!
}

type PendingHouseholdInvitation implements Node & HouseholdInvitation {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  expiresAt: DateTime!
  createdAt: DateTime!
}

type AcceptedHouseholdInvitation implements Node & HouseholdInvitation {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  expiresAt: DateTime!
  createdAt: DateTime!
  acceptedAt: DateTime!
}

type RevokedHouseholdInvitation implements Node & HouseholdInvitation {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  expiresAt: DateTime!
  createdAt: DateTime!
  revokedAt: DateTime!
}

type ExpiredHouseholdInvitation implements Node & HouseholdInvitation {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  expiresAt: DateTime!
  createdAt: DateTime!
}

type HouseholdInvitationEdge {
  cursor: String!
  node: HouseholdInvitation!
}

type HouseholdInvitationConnection {
  edges: [HouseholdInvitationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  householdInvitations(householdId: ID! @nodeID(of: "Household"), after: String, before: String, first: Int, last: Int): HouseholdInvitationConnection!
}
