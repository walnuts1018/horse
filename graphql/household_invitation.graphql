enum HouseholdInvitationStatus {
  PENDING
  ACCEPTED
  REVOKED
  EXPIRED
}

type HouseholdInvitation implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  status: HouseholdInvitationStatus!
  expiresAt: DateTime!
  createdAt: DateTime!
  revokedAt: DateTime
  acceptedAt: DateTime
}

type CreatedHouseholdInvitation {
  invitation: HouseholdInvitation!
  token: String!
}

type HouseholdInvitationEdge {
  cursor: String!
  node: HouseholdInvitation!
}

type HouseholdInvitationConnection {
  edges: [HouseholdInvitationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  householdInvitations(householdId: ID! @nodeID(of: "Household"), after: String, before: String, first: Int, last: Int): HouseholdInvitationConnection!
}
