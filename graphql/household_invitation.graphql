enum HouseholdInvitationStatus {
  PENDING
  ACCEPTED
  REVOKED
  EXPIRED
}

type HouseholdInvitation implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  role: String!
  status: HouseholdInvitationStatus!
  expiresAt: String!
  createdAt: String!
  revokedAt: String
  acceptedAt: String
}

type HouseholdInvitationEdge {
  cursor: String!
  node: HouseholdInvitation!
}

type HouseholdInvitationConnection {
  edges: [HouseholdInvitationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  householdInvitations(householdId: ID! @nodeID(of: "Household"), after: String, first: Int = 50): HouseholdInvitationConnection!
}
