type LoanBalance implements Node {
  id: ID!
  lenderMemberId: ID! @goField(forceResolver: true)
  borrowerMemberId: ID! @goField(forceResolver: true)
  principalYen: Long!
  repaidYen: Long!
  balanceYen: Long!
  createdAt: String!
}

type LoanBalanceEdge {
  cursor: String!
  node: LoanBalance!
}

type LoanBalanceConnection {
  edges: [LoanBalanceEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  loanBalances(householdId: ID! @nodeID(of: "Household"), after: String, first: Int = 50): LoanBalanceConnection!
}
