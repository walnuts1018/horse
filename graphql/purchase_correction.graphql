interface PurchaseCorrection implements Node {
  id: ID! @goField(forceResolver: true)
  amountDeltaYen: Long!
  reason: String!
  occurredAt: DateTime!
  settlementMonth: YearMonth!
  paymentAllocations: [PurchasePayment!]!
}

type PurchaseWideCorrection implements PurchaseCorrection & Node {
  id: ID! @goField(forceResolver: true)
  amountDeltaYen: Long!
  reason: String!
  occurredAt: DateTime!
  settlementMonth: YearMonth!
  paymentAllocations: [PurchasePayment!]!
}

type PurchaseItemCorrection implements PurchaseCorrection & Node {
  id: ID! @goField(forceResolver: true)
  itemId: ID! @goField(forceResolver: true)
  amountDeltaYen: Long!
  reason: String!
  occurredAt: DateTime!
  settlementMonth: YearMonth!
  paymentAllocations: [PurchasePayment!]!
}

type PurchaseCorrectionEdge {
  cursor: String!
  node: PurchaseCorrection!
}

type PurchaseCorrectionConnection {
  edges: [PurchaseCorrectionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  purchaseCorrections(
    purchaseId: ID! @nodeID(of: "Purchase")
    first: Int
    after: String
  ): PurchaseCorrectionConnection!
}
