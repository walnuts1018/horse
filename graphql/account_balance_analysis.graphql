type AccountBalanceAnalysis {
  accountId: ID! @goField(forceResolver: true)
  currency: String!
  from: YearMonth!
  to: YearMonth!
  openingBalanceYen: Long!
  closingBalanceYen: Long!
  changes: AccountBalanceChangeConnection!
}

type AccountBalanceChange {
  occurredAt: DateTime!
  source: AccountBalanceSource!
  description: String!
  changeYen: Long!
  balanceYen: Long!
}

type AccountBalanceChangeEdge {
  cursor: String!
  node: AccountBalanceChange!
}

type AccountBalanceChangeConnection {
  edges: [AccountBalanceChangeEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

union AccountBalanceSource =
  | AccountOpeningBalance
  | Purchase
  | PurchaseWideCorrection
  | PurchaseItemCorrection
  | CorrectionLedgerEntry
  | FundingLedgerEntry
  | PurchaseLedgerEntry
  | AdvanceTransferLedgerEntry
  | LoanTransferLedgerEntry
  | RepaymentTransferLedgerEntry
  | GiftTransferLedgerEntry
  | AccountMovement
  | AccountIncome

type AccountOpeningBalance implements Node {
  id: ID!
  account: Account!
}

extend type Query {
  accountBalanceAnalysis(
    householdId: ID! @nodeID(of: "Household")
    accountId: ID! @nodeID(of: "Account")
    from: YearMonth!
    to: YearMonth!
    first: Int
    after: String
  ): AccountBalanceAnalysis!
}
