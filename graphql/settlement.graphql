interface Settlement implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  period: YearMonth!
  revision: Int!
  lines: [SettlementLine!]!
}

type OpenSettlement implements Node & Settlement {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  period: YearMonth!
  revision: Int!
  lines: [SettlementLine!]!
}

type ClosedSettlement implements Node & Settlement {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  period: YearMonth!
  revision: Int!
  lines: [SettlementLine!]!
  createdAt: DateTime! @goField(forceResolver: true)
}

type SettlementLine {
  memberId: ID! @goField(forceResolver: true)
  memberName: String!
  scheduledYen: Long!
  paidYen: Long!
  carryYen: Long!
  priorBalanceYen: Long!
  monthlyAdjustmentYen: Long!
  advanceCreditYen: Long!
  amountDueYen: Long!
  evidence: [SettlementEvidence!]!
}

type SettlementEvidence {
  kind: String!
  label: String!
  amountYen: Long!
  sourceId: ID!
  purchaseId: ID
  occurredAt: DateTime
}

extend type Query {
  settlement(householdId: ID! @nodeID(of: "Household"), period: YearMonth!): Settlement!
}
