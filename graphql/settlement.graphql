enum SettlementStatus {
  OPEN
  CLOSED
}

type Settlement implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  period: YearMonth!
  status: SettlementStatus!
  revision: Int!
  lines: [SettlementLine!]!
  createdAt: DateTime
}

type SettlementLine {
  memberId: ID! @goField(forceResolver: true)
  memberName: String!
  scheduledYen: Long!
  paidYen: Long!
  carryYen: Long!
  priorBalanceYen: Long!
  monthlyAdjustmentYen: Long!
  advanceCreditYen: Long!
  amountDueYen: Long!
}

extend type Query {
  settlement(householdId: ID! @nodeID(of: "Household"), period: YearMonth!): Settlement!
}
