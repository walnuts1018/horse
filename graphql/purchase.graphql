enum SourceKind {
  RECEIPT
  ORDER
  EMAIL
  CARD
  BANK
}

type Purchase implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  occurredAt: DateTime!
  merchant: String!
  origin: PurchaseOrigin!
  hasEvidence: Boolean!
  sourceKinds: [SourceKind!]!
  paymentAllocations: [PurchasePayment!]!
  items: [PurchaseItem!]!
  corrections(first: Int, after: String): PurchaseCorrectionConnection! @goField(name: "CorrectionsConnection", forceResolver: true)
  totalYen: Long!
  currency: String!
  revision: Int!
  status: PurchaseStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum PurchaseStatus {
  DRAFT
  POSTED
  CLOSED
}

enum PurchaseOrigin {
  AI
  MANUAL
  UNKNOWN
}

type PurchaseEdge {
  cursor: String!
  node: Purchase!
}

type PurchaseConnection {
  edges: [PurchaseEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  syncCursor: String!
}

extend type Query {
  purchases(householdId: ID! @nodeID(of: "Household"), from: DateTime, to: DateTime, origin: PurchaseOrigin, hasEvidence: Boolean, search: String, categoryId: ID @nodeID(of: "Category"), uncategorized: Boolean, tagId: ID @nodeID(of: "Tag"), paymentAccountId: ID @nodeID(of: "Account"), poolId: ID @nodeID(of: "Pool"), after: String, before: String, first: Int, last: Int): PurchaseConnection!
}
