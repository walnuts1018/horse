type Purchase implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  occurredAt: DateTime!
  merchant: String!
  origin: PurchaseOrigin!
  hasEvidence: Boolean!
  sourceKinds: [SourceKind!]!
  paymentAllocations: [PurchasePayment!]!
  items: [PurchaseItem!]!
  corrections: [PurchaseCorrection!]!
  totalYen: Long!
  currency: String!
  revision: Int!
  status: PurchaseStatus!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum PurchaseStatus {
  DRAFT
  POSTED
  CLOSED
}

enum PurchaseOrigin {
  AI
  MANUAL
  UNKNOWN
}

type PurchasePayment {
  paymentAccountId: ID! @goField(forceResolver: true)
  account: Account!
  amountYen: Long!
}

input PurchasePaymentInput {
  paymentAccountId: ID! @nodeID(of: "Account")
  amountYen: Long!
}

type PurchaseEdge {
  cursor: String!
  node: Purchase!
}

type PurchaseConnection {
  edges: [PurchaseEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  syncCursor: String!
}

extend type Query {
  purchases(householdId: ID! @nodeID(of: "Household"), from: DateTime, to: DateTime, origin: PurchaseOrigin, hasEvidence: Boolean, after: String, before: String, first: Int, last: Int): PurchaseConnection!
}
