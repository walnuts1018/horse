type PurchaseItem implements Node {
  id: ID! @goField(forceResolver: true)
  name: String!
  amountYen: Long!
  remainingRefundableAmountYen: Long!
  currency: String!
  quantity: PurchaseQuantity
  printedUnitPrice: PrintedUnitPrice
  effectiveUnitPrice: EffectiveUnitPrice
  categoryId: ID @goField(forceResolver: true)
  productVariantId: ID @goField(forceResolver: true)
  allocations: [PurchaseItemAllocation!]!
  tags: [Tag!]!
  revision: Int!
}

type PurchaseItemAllocation {
  poolId: ID! @goField(forceResolver: true)
  poolName: String!
  weight: Long!
  amountYen: Long!
}

type PurchaseQuantity {
  numerator: String!
  denominator: String!
  unit: String!
}

type PrintedUnitPrice {
  amountYen: Long!
  basis: PurchaseQuantity!
}

type EffectiveUnitPrice {
  numeratorYen: String!
  denominatorYen: String!
}
