type AccountMovement implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  kind: AccountMovementKind!
  occurredAt: DateTime!
  fromAccountId: ID! @goField(forceResolver: true)
  fromAccount: Account! @goField(forceResolver: true)
  toAccountId: ID! @goField(forceResolver: true)
  toAccount: Account! @goField(forceResolver: true)
  amountYen: Long!
  currency: String!
  description: String!
  createdAt: DateTime!
}

type AccountMovementEdge {
  cursor: String!
  node: AccountMovement!
}

type AccountMovementConnection {
  edges: [AccountMovementEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

enum AccountMovementKind {
  TRANSFER
  CARD_BILL_PAYMENT
}

extend type Query {
  accountMovements(
    householdId: ID! @nodeID(of: "Household")
    after: String
    before: String
    first: Int
    last: Int
  ): AccountMovementConnection!
}
