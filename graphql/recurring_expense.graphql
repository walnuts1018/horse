type RecurringExpense implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  name: String!
  merchant: String!
  amountYen: Long!
  currency: String!
  categoryId: ID @goField(forceResolver: true)
  paymentAccountId: ID @goField(forceResolver: true)
  cadence: String!
  startsOn: String!
  nextDueOn: String!
  endsOn: String
  archived: Boolean!
  revision: Int!
}

extend type Query {
  recurringExpenses(householdId: ID! @nodeID(of: "Household"), includeArchived: Boolean = false, after: String, before: String, first: Int, last: Int): RecurringExpenseConnection!
}

type RecurringExpenseEdge {
  cursor: String!
  node: RecurringExpense!
}

type RecurringExpenseConnection {
  edges: [RecurringExpenseEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}
