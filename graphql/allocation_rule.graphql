interface AllocationRuleTarget {
  name: String!
}

type MerchantAllocationRuleTarget implements AllocationRuleTarget {
  name: String!
}

type AllocationRule implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  target: AllocationRuleTarget!
  revision: Int!
  allocations: [Allocation!]!
}

type AllocationRuleEdge {
  cursor: String!
  node: AllocationRule!
}

type AllocationRuleConnection {
  edges: [AllocationRuleEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  allocationRules(householdId: ID! @nodeID(of: "Household"), after: String, before: String, first: Int, last: Int): AllocationRuleConnection!
}
