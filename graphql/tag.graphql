type Tag implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  name: String!
  archived: Boolean!
  revision: Int!
}

type TagEdge {
  cursor: String!
  node: Tag!
}

type TagConnection {
  edges: [TagEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  tags(householdId: ID! @nodeID(of: "Household"), includeArchived: Boolean = false, after: String, before: String, first: Int, last: Int): TagConnection!
}
