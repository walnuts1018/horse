type ProductConcept implements Node & AllocationRuleTarget {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  name: String!
  normalizedName: String!
  categoryId: ID @goField(forceResolver: true)
  archived: Boolean!
  revision: Int!
  variants: [ProductVariant!]!
}

type ProductConceptEdge {
  cursor: String!
  node: ProductConcept!
}

type ProductConceptConnection {
  edges: [ProductConceptEdge!]!
  pageInfo: PageInfo!
}

extend type Query {
  productCatalog(householdId: ID! @nodeID(of: "Household"), after: String, before: String, first: Int, last: Int): ProductConceptConnection!
}
