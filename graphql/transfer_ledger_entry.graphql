interface TransferLedgerEntry implements LedgerEntry & Node {
  id: ID! @goField(forceResolver: true)
  occurredAt: DateTime!
  description: String!
  amountYen: Long!
  currency: String!
  createdAt: DateTime!
  fromMember: Member!
  toMember: Member!
}

