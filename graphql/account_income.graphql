type AccountIncome implements Node {
  id: ID! @goField(forceResolver: true)
  householdId: ID! @goField(forceResolver: true)
  accountId: ID! @goField(forceResolver: true)
  amountYen: Long!
  currency: String!
  occurredAt: DateTime!
  description: String!
  createdAt: DateTime!
}

type AccountIncomeEdge {
  cursor: String!
  node: AccountIncome!
}

type AccountIncomeConnection {
  edges: [AccountIncomeEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  accountIncomes(
    householdId: ID! @nodeID(of: "Household")
    after: String
    before: String
    first: Int
    last: Int
  ): AccountIncomeConnection!
}
