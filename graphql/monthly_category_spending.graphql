type MonthlyCategorySpending {
  period: YearMonth!
  categoryId: ID @goField(forceResolver: true)
  categoryName: String
  amountYen: Long!
}

extend type Query {
  monthlyCategorySpending(
    householdId: ID! @nodeID(of: "Household")
    from: YearMonth!
    to: YearMonth!
  ): [MonthlyCategorySpending!]!
}
