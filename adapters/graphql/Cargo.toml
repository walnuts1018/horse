[package]
name = "horse-graphql-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-graphql = { version = "7", features = ["chrono"] }
base64 = { workspace = true }
bookkeeping-domain = { path = "../../contexts/bookkeeping/domain" }
bookkeeping-application = { path = "../../contexts/bookkeeping/application" }
bookkeeping-postgres = { path = "../../contexts/bookkeeping/postgres" }
chrono = { version = "0.4", features = ["serde"] }
catalog-application = { path = "../../contexts/catalog/application" }
catalog-domain = { path = "../../contexts/catalog/domain" }
cross-context-postgres = { path = "../../contexts/cross-context/postgres" }
diesel = { workspace = true }
diesel-async = { workspace = true }
futures-util = { workspace = true }
futures-channel = "0.3"
horse-postgres-common = { path = "../../platform/postgres-common" }
household-application = { path = "../../contexts/household/application" }
household-postgres = { path = "../../contexts/household/postgres" }
policy-application = { path = "../../contexts/policy/application" }
policy-postgres = { path = "../../contexts/policy/postgres" }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1", features = ["std"] }
tracing = { workspace = true }
tokio = { workspace = true }
