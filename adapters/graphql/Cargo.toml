evidence-application = { path = "../../contexts/evidence/application" }
catalog-domain = { path = "../../contexts/catalog/domain" }
cross-context-application = { path = "../../contexts/cross-context/application" }
futures-util = { workspace = true }
futures-channel = "0.3"
household-application = { path = "../../contexts/household/application" }
policy-application = { path = "../../contexts/policy/application" }
serde_json = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
uuid = { version = "1", features = ["std"] }
tracing = { workspace = true }
tokio = { workspace = true }
